# Pacemaker — keeps raffy's instabox machine from pausing itself.
#
# instabox pauses a sandbox after **30 minutes idle** and the API gives no way to
# turn that off. A paused machine runs nothing, so nothing on the box can wake it,
# and a visit to its public URL does NOT wake it either (a suspended machine answers
# 503 and stays suspended — tested 2026-10-16). Only the API can:
#   * a read  (GET /v1/machines/{id}) while running resets the idle timer
#   * a resume (POST /v1/machines/{id}/resume) brings it back in ~5 seconds, with
#     pause/resume transparent to what is inside (systemd never notices)
#
# This repo is PUBLIC on purpose: scheduled workflows in public repos do not spend
# the 2,000 monthly Actions minutes a private repo gets, so this can run every five
# minutes and stay well inside the 30-minute pause window even when GitHub delays a
# run. It holds no secrets except the repo secret INSTABOX_API_KEY, which workflow
# runs can read and nobody else can. There is nothing else in here worth reading.
#
# Same job also lives in the private vault repo (raffyfatlly/claude) as a slower
# backstop. Background: notes/dsh-moved-house-to-instabox.md in that repo.
name: Pacemaker

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: pacemaker
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  poke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Needed only by the stamp step below; the poke itself is a plain API call.
      - uses: actions/checkout@v4

      - name: Poke the machine
        env:
          INSTABOX_API_KEY: ${{ secrets.INSTABOX_API_KEY }}
        run: |
          set -euo pipefail
          API=https://api.instabox.sh
          M=m_agquf47fnybmaewlqsuhlhft3m      # instabox machine "kael": Kael + the DSH harness
          if [ -z "${INSTABOX_API_KEY:-}" ]; then
            echo "INSTABOX_API_KEY is not set as a repo secret — nothing to do."
            exit 1
          fi
          state=$(curl -sS --max-time 30 -H "Authorization: Bearer $INSTABOX_API_KEY" \
            "$API/v1/machines/$M" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("state","unknown"))')
          echo "machine state: $state"
          case "$state" in
            running)
              echo "awake; the read above is itself the poke that resets the idle timer"
              ;;
            suspended|paused)
              echo "asleep — resuming"
              curl -sS --max-time 60 -X POST -H "Authorization: Bearer $INSTABOX_API_KEY" \
                -H "Idempotency-Key: gh-resume-$GITHUB_RUN_ID" "$API/v1/machines/$M/resume"
              ;;
            stopped)
              echo "stopped — starting"
              curl -sS --max-time 60 -X POST -H "Authorization: Bearer $INSTABOX_API_KEY" \
                -H "Idempotency-Key: gh-start-$GITHUB_RUN_ID" "$API/v1/machines/$M/start"
              ;;
            *)
              echo "unexpected state '$state' — reporting rather than guessing"
              exit 1
              ;;
          esac

      # GitHub disables scheduled workflows in a repo with no activity for 60 days,
      # and this one is quiet by design. A timestamp commit once a day is the
      # cheapest way to keep it alive. Pushes made with GITHUB_TOKEN do not trigger
      # workflow runs, so this cannot feed itself.
      - name: Keep this workflow from being disabled for inactivity
        run: |
          set -euo pipefail
          today=$(date -u +%Y-%m-%d)
          if [ "$(cat last-poke.txt 2>/dev/null || echo none)" = "$today" ]; then
            echo "already stamped today"
            exit 0
          fi
          echo "$today" > last-poke.txt
          git config user.name "pacemaker"
          git config user.email "pacemaker@users.noreply.github.com"
          git add last-poke.txt
          git commit -m "pacemaker alive: $today"
          git push
